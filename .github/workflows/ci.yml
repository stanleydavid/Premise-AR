name: CI
on:
  push:
    branches: [feat/production]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://semak_app:semak_app_ci@localhost:5432/semak_test
      DATABASE_MIGRATION_URL: postgres://postgres:postgres@localhost:5432/semak_test
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789
      NRIC_HMAC_SECRET: ci-nric-hmac-secret-0123456789abcdef012345
      PHOTO_STORAGE_DIR: ./storage/test-photos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Create database and app role (non-superuser, as in production)
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -c "create role semak_app login password 'semak_app_ci'"
          psql -h localhost -U postgres -c "create database semak_test"
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
